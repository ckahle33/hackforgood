{% extends "base.html" %}
{% block title %}Unsubscribe &middot; {{ site_name }}{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Unsubscribe</h1>
  <p>Stop sending emails to <strong>{{ sub.email }}</strong>?</p>
  <form method="post"><button class="btn">Unsubscribe</button></form>
</section>
{% endblock %}
